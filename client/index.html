<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnhanceUs - Goal-Driven Skill Exchange</title>
    <meta name="description" content="EnhanceUs is a goal-driven peer-to-peer skill exchange platform that identifies capability gaps and connects you with verified mentors and collaborative learners." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.briefenai.me/" />

    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="EnhanceUs" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.briefenai.me/" />
    <meta property="og:title" content="EnhanceUs - Goal-Driven Peer Skill Exchange" />
    <meta property="og:description" content="Identify capability gaps, generate milestone roadmaps, and connect with peers for reciprocal 1-on-1 knowledge exchange and collaborative learning." />
    <meta property="og:image" content="https://www.briefenai.me/favicon.png" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://www.briefenai.me/" />
    <meta name="twitter:title" content="EnhanceUs - Goal-Driven Peer Skill Exchange" />
    <meta name="twitter:description" content="Identify capability gaps, generate milestone roadmaps, and connect with peers for reciprocal 1-on-1 knowledge exchange and collaborative learning." />
    <meta name="twitter:image" content="https://www.briefenai.me/favicon.png" />

    <!-- Authentic JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.briefenai.me/#website",
            "url": "https://www.briefenai.me/",
            "name": "EnhanceUs",
            "description": "Goal-driven peer-to-peer skill exchange platform connecting ambitious learners through reciprocal knowledge sharing."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.briefenai.me/#application",
            "name": "EnhanceUs",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web Browser",
            "url": "https://www.briefenai.me/",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "description": "Peer skill exchange platform featuring goal gap analysis, structured roadmaps, collaborative circles, and verified peer reviews."
          }
        ]
      }
    </script>
    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('enhanceus_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // Fallback gracefully if localStorage is unavailable
        }
      })();
    </script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 selection:bg-teal-100 dark:selection:bg-teal-900 selection:text-teal-900 dark:selection:text-teal-100 font-sans transition-colors duration-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
